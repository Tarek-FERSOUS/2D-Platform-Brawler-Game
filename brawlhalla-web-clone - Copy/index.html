<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brawlhalla Web Clone</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas" width="1280" height="720"></canvas>
      <div id="hud-help">
        <h1>Brawlhalla Web Clone</h1>
        <p>
          P1: A/D move, W jump, S fast-fall, J light, K heavy, L dodge
        </p>
        <p>
          P2: Arrow keys move/jump, Numpad 1 light, Numpad 2 heavy, Numpad 3
          dodge
        </p>
        <p>Press <strong>B</strong> to toggle Bot control for Player 2.</p>
      </div>
    </div>
    <script type="module" src="./src/game.js"></script>
  </body>
</html>
